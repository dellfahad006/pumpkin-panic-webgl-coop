name: Build WebGL (Buildalon)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install FFmpeg and XVFB
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb
          # Unity 2020.3's WebGL compiler (Emscripten FastComp clang) needs libtinfo.so.5, which this runner image lacks
          sudo apt-get install -y libtinfo5 || true
          if [ ! -e /lib/x86_64-linux-gnu/libtinfo.so.5 ] && [ ! -e /usr/lib/x86_64-linux-gnu/libtinfo.so.5 ]; then
            sudo ln -s /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5
          fi
          ls -l /lib/x86_64-linux-gnu/libtinfo.so.5 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true

      - name: Fetch exported project
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1 -p project.tar.gz
          mkdir project
          tar -xzf project.tar.gz -C project
          rm project.tar.gz

      - name: Patch Project Settings and Cleanup
        run: |
          # 1. Remove Steam plugins and scripts
          find project -iname 'Facepunch.Steamworks*' -delete
          find project -iname 'steam_api*' -delete
          find project/Assets -name AchievementTest.cs -exec cp ci/AchievementTest.cs {} \;
          find project/Assets -name SteamTest.cs -exec cp ci/SteamTest.cs {} \;

          # 2. Remove Steam references from .asmdef files
          python3 - <<'PYEOF'
          import glob, json
          for p in glob.glob('project/Assets/**/*.asmdef', recursive=True):
              d = json.load(open(p, encoding='utf-8-sig'))
              for k in ('references', 'precompiledReferences'):
                  if k in d:
                      d[k] = [x for x in d[k] if 'steam' not in x.lower()]
              json.dump(d, open(p, 'w', encoding='utf-8'), indent=2)
          PYEOF

          # 3. Rename duplicate audio file
          if [ -f "project/Assets/AudioClip/clickSound.ogg" ]; then
            mv "project/Assets/AudioClip/clickSound.ogg" "project/Assets/AudioClip/clickSound_lower.ogg"
            mv "project/Assets/AudioClip/clickSound.ogg.meta" "project/Assets/AudioClip/clickSound_lower.ogg.meta"
          fi

          # 4. Change Color Space and Compression
          python3 - <<'PYEOF'
          import re
          import sys

          file_path = 'project/ProjectSettings/ProjectSettings.asset'
          with open(file_path, 'r', encoding='utf-8') as f:
              content = f.read()

          new_content, count1 = re.subn(r'(m_ActiveColorSpace:\s*)\d+', r'\g<1>0', content)
          if count1 != 1: sys.exit(1)

          new_content, count2 = re.subn(r'(webGLCompressionFormat:\s*)\d+', r'\g<1>2', new_content)
          if count2 != 1: sys.exit(1)

          with open(file_path, 'w', encoding='utf-8') as f:
              f.write(new_content)
          print("Successfully patched ColorSpace and Compression.")
          PYEOF

      - name: Fix recovered-project problems
        run: |
          python3 - <<'PYEOF'
          import shutil, os

          # WebGL has no compute shaders, and these exported ones are broken
          shutil.rmtree('project/Assets/ComputeShader', ignore_errors=True)
          if os.path.exists('project/Assets/ComputeShader.meta'):
              os.remove('project/Assets/ComputeShader.meta')

          # Nightmare scene shares SampleScene's GUID; give it its own
          old = '9fc0d4010bbf28b4594072e72b8655ab'
          new = '60d859c6485049e8972169b0cd25e604'

          p = 'project/Assets/Scenes/Nightmare.unity.meta'
          s = open(p, encoding='utf-8').read()
          assert old in s
          open(p, 'w', encoding='utf-8').write(s.replace(old, new))

          p = 'project/ProjectSettings/EditorBuildSettings.asset'
          s = open(p, encoding='utf-8').read()
          parts = s.split(old)
          assert len(parts) == 3, len(parts)
          open(p, 'w', encoding='utf-8').write(parts[0] + old + parts[1] + new + parts[2])
          print('Patched compute shaders and scene GUID')
          PYEOF

      - name: Fix missing click audio and ghoul spawn animator error
        run: |
          python3 - <<'PYEOF'
          import os, re, shutil, sys

          # ---------- 1. Click sounds ----------
          # AssetRipper exported two clips whose names differ only by letter case
          # (ClickSound / clickSound). The archive lost the .ogg of one and the .meta of
          # the other, so every scene reference to them resolved to "null AudioClip".
          d = 'project/Assets/AudioClip'
          UP_GUID = 'a99c1a330ea8a494d88004352a371bae'   # used by shop buy / can't-buy sounds
          LO_GUID = '28ca20cf3e75fec4eb8f56888d1b4cdc'   # used by UI click sounds
          up, lo = d + '/ClickSound.ogg', d + '/clickSound.ogg'
          lo_meta, lo2, lo2_meta = lo + '.meta', d + '/clickSound_lower.ogg', d + '/clickSound_lower.ogg.meta'

          META = """fileFormatVersion: 2
          guid: {guid}
          licenseType: Free
          AudioImporter:
            serializedVersion: 6
            externalObjects: {{}}
            defaultSettings:
              loadType: 0
              sampleRateSetting: 0
              sampleRateOverride: 0
              compressionFormat: 1
              quality: 0
              conversionMode: 0
            platformSettingOverrides: {{}}
            forceToMono: 0
            normalize: 0
            preloadAudioData: 1
            loadInBackground: 0
            ambisonic: 0
            3D: 0
            userData:
            assetBundleName:
            assetBundleVariant:
          """

          if os.path.isfile(up):
              # a) capital ClickSound.ogg has no .meta -> restore it with its original GUID
              if not os.path.exists(up + '.meta'):
                  open(up + '.meta', 'w').write(META.format(guid=UP_GUID))
                  print('Restored ClickSound.ogg.meta')
              # b) the lowercase clip: keep the real file if present, else reuse ClickSound.ogg
              if os.path.isfile(lo):
                  shutil.move(lo, lo2)
                  if os.path.exists(lo_meta): shutil.move(lo_meta, lo2_meta)
              elif not os.path.exists(lo2):
                  shutil.copy(up, lo2)
                  if os.path.exists(lo_meta): shutil.move(lo_meta, lo2_meta)
              if not os.path.exists(lo2_meta):
                  open(lo2_meta, 'w').write(META.format(guid=LO_GUID))
              print('Click sounds repaired')
          else:
              print('ClickSound.ogg not found - skipping audio repair')

          # ---------- 2. Ghoul spawn: Animator state that does not exist ----------
          p = 'project/Assets/Scripts/Assembly-CSharp/loop1.cs'
          s = open(p, encoding='utf-8').read()
          if 'SafePlay(' not in s:
              for old in ('waypoint1.Play("enemyWaypoint1");', 'waypoint2.Play("enemyWaypoint2");'):
                  assert old in s, old
              s = s.replace('waypoint1.Play("enemyWaypoint1");', 'SafePlay(waypoint1, "enemyWaypoint1");')
              s = s.replace('waypoint2.Play("enemyWaypoint2");', 'SafePlay(waypoint2, "enemyWaypoint2");')
              helper = ('\tprivate static void SafePlay(Animator animator, string stateName)\n'
                        '\t{\n'
                        '\t\tif (animator == null) return;\n'
                        '\t\tif (animator.HasState(0, Animator.StringToHash(stateName)) || animator.HasState(0, Animator.StringToHash("Base Layer." + stateName)))\n'
                        '\t\t{\n'
                        '\t\t\tanimator.Play(stateName);\n'
                        '\t\t}\n'
                        '\t}\n\n')
              marker = '\tprivate IEnumerator monsterSpawn()'
              assert marker in s
              s = s.replace(marker, helper + marker, 1)
              open(p, 'w', encoding='utf-8').write(s)
              print('Patched loop1.cs')
          PYEOF

      - name: Apply gameplay and performance patches
        run: python3 ci/patch_game.py project

      - name: Install WebGL co-op client files
        run: python3 ci/install_webgl_coop.py project

      - name: Shrink non-sprite textures only
        run: |
          python3 - <<'PYEOF'
          import glob, re
          capped = 0
          skipped = 0
          for p in glob.glob('project/Assets/Texture2D/*.meta'):
              s = open(p, encoding='utf-8', errors='ignore').read()
              m = re.search(r'^\s*textureType:\s*(\d+)', s, re.M)
              # textureType 8 = Sprite. Sprite assets store pixel positions for the
              # original texture size, so these textures must NOT be resized.
              if m and m.group(1) == '8':
                  skipped += 1
                  continue
              t = re.sub(r'(maxTextureSize:\s*)(\d+)',
                         lambda x: x.group(1) + str(min(int(x.group(2)), 1024)), s)
              if t != s:
                  open(p, 'w', encoding='utf-8').write(t)
                  capped += 1
          print('Capped', capped, 'non-sprite textures to 1024px; left', skipped, 'sprite textures at full size')
          PYEOF

      - name: Set WebGL template
        run: |
          sed -i 's/^\(\s*webGLTemplate:\).*$/\1 APPLICATION:Default/' project/ProjectSettings/ProjectSettings.asset
          grep -n "webGLTemplate" project/ProjectSettings/ProjectSettings.asset

      - name: Restore TextMeshPro shaders
        run: |
          mkdir -p /tmp/tmp-pkg
          cd /tmp/tmp-pkg
          npm pack com.unity.textmeshpro@3.0.6 --registry https://packages.unity.com && tar -xzf com.unity.textmeshpro-3.0.6.tgz || echo "npm download failed"
          if [ ! -d package/Shaders ]; then
            curl -fsSL -o tmp.tgz https://download.packages.unity.com/com.unity.textmeshpro/-/com.unity.textmeshpro-3.0.6.tgz && tar -xzf tmp.tgz || echo "curl download failed"
          fi
          ls package/Shaders 2>/dev/null || echo "NO package/Shaders folder found"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PYEOF'
          import glob, os, re, shutil

          SDF_SUBSHADER = r"""
          SubShader {
            Tags { "Queue"="Transparent" "IgnoreProjector"="True" "RenderType"="Transparent" }
            Stencil {
              Ref [_Stencil]
              Comp [_StencilComp]
              Pass [_StencilOp]
              ReadMask [_StencilReadMask]
              WriteMask [_StencilWriteMask]
            }
            Cull [_CullMode]
            ZWrite Off
            Lighting Off
            Fog { Mode Off }
            ZTest [unity_GUIZTestMode]
            Blend One OneMinusSrcAlpha
            ColorMask [_ColorMask]
            Pass {
              CGPROGRAM
              #pragma vertex VertShader
              #pragma fragment PixShader
              #include "UnityCG.cginc"
              sampler2D _MainTex;
              half4 _FaceColor;
              half4 _OutlineColor;
              float _OutlineWidth;
              float _FaceDilate;
              float _WeightNormal;
              float _WeightBold;
              float _ScaleRatioA;
              float _GradientScale;
              float _ScaleX;
              float _ScaleY;
              float _Sharpness;
              float _VertexOffsetX;
              float _VertexOffsetY;
              float _MaskSoftnessX;
              float _MaskSoftnessY;
              float4 _ClipRect;
              struct appdata {
                float4 vertex : POSITION;
                float4 color : COLOR;
                float4 texcoord0 : TEXCOORD0;
                float2 texcoord1 : TEXCOORD1;
              };
              struct v2f {
                float4 vertex : SV_POSITION;
                fixed4 color : COLOR;
                float2 atlas : TEXCOORD0;
                float4 param : TEXCOORD1;
                float4 mask : TEXCOORD2;
              };
              v2f VertShader(appdata input) {
                v2f o;
                float4 vert = input.vertex;
                vert.x += _VertexOffsetX;
                vert.y += _VertexOffsetY;
                float4 vPosition = UnityObjectToClipPos(vert);
                float2 pixelSize = vPosition.w;
                pixelSize /= float2(_ScaleX, _ScaleY) * abs(mul((float2x2)UNITY_MATRIX_P, _ScreenParams.xy));
                float scale = rsqrt(dot(pixelSize, pixelSize));
                scale *= abs(input.texcoord1.y) * _GradientScale * (_Sharpness + 1);
                float bold = step(input.texcoord1.y, 0);
                float weight = lerp(_WeightNormal, _WeightBold, bold) / 4.0;
                weight = (weight + _FaceDilate) * _ScaleRatioA * 0.5;
                float4 clampedRect = clamp(_ClipRect, -2e10, 2e10);
                o.vertex = vPosition;
                o.color = input.color;
                o.atlas = input.texcoord0.xy;
                o.param = float4(scale, 0.5 - weight, 0, 0);
                o.mask = float4(vert.xy * 2 - clampedRect.xy - clampedRect.zw,
                                0.25 / (0.25 * float2(_MaskSoftnessX, _MaskSoftnessY) + pixelSize.xy));
                return o;
              }
              fixed4 PixShader(v2f input) : SV_Target {
                float scale = input.param.x;
                float edge = input.param.y;
                float d = tex2D(_MainTex, input.atlas).a;
                float sd = (d - edge) * scale;
                float ow = _OutlineWidth * _ScaleRatioA * scale;
                half faceA = saturate(sd - ow * 0.5 + 0.5);
                half allA = saturate(sd + ow * 0.5 + 0.5);
                half4 face = _FaceColor;
                face.rgb *= input.color.rgb;
                face.a *= input.color.a;
                half4 outl = _OutlineColor;
                outl.a *= input.color.a;
                half4 c = face;
                half coverage = faceA;
                if (_OutlineWidth > 0.0001) {
                  c = lerp(outl, face, faceA);
                  coverage = allA;
                }
                half4 res;
                res.a = c.a * coverage;
                res.rgb = c.rgb * res.a;
                float2 m = saturate((_ClipRect.zw - _ClipRect.xy - abs(input.mask.xy)) * input.mask.zw);
                res *= m.x * m.y;
                return res;
              }
              ENDCG
            }
          }
          }
          """

          SPRITE_SUBSHADER = r"""
          SubShader {
            Tags { "Queue"="Transparent" "IgnoreProjector"="True" "RenderType"="Transparent" }
            Cull Off
            ZWrite Off
            Lighting Off
            Fog { Mode Off }
            Blend One OneMinusSrcAlpha
            Pass {
              CGPROGRAM
              #pragma vertex vert
              #pragma fragment frag
              #include "UnityCG.cginc"
              sampler2D _MainTex;
              struct appdata {
                float4 vertex : POSITION;
                float4 color : COLOR;
                float2 uv : TEXCOORD0;
              };
              struct v2f {
                float4 pos : SV_POSITION;
                fixed4 color : COLOR;
                float2 uv : TEXCOORD0;
              };
              v2f vert(appdata i) {
                v2f o;
                o.pos = UnityObjectToClipPos(i.vertex);
                o.color = i.color;
                o.uv = i.uv;
                return o;
              }
              fixed4 frag(v2f i) : SV_Target {
                fixed4 c = tex2D(_MainTex, i.uv) * i.color;
                c.rgb *= c.a;
                return c;
              }
              ENDCG
            }
          }
          }
          """

          src = '/tmp/tmp-pkg/package/Shaders'
          dst = 'project/Assets/Shader'

          real = {}
          for f in glob.glob(src + '/*.shader'):
              txt = open(f, encoding='utf-8', errors='ignore').read()
              m = re.search(r'^\s*Shader\s+"([^"]+)"', txt, re.M)
              if m:
                  real[m.group(1)] = txt
          print('Real TextMeshPro shaders available from package:', sorted(real))

          if real:
              for f in glob.glob(src + '/*.cginc'):
                  shutil.copy(f, dst)

          n_real = 0
          n_fallback = 0
          for f in glob.glob(dst + '/*.shader'):
              txt = open(f, encoding='utf-8', errors='ignore').read()
              m = re.search(r'^\s*Shader\s+"([^"]+)"', txt, re.M)
              if not m or not m.group(1).startswith('TextMeshPro/'):
                  continue
              name = m.group(1)
              if name in real:
                  open(f, 'w', encoding='utf-8').write(real[name])
                  n_real += 1
                  print('REAL shader restored:', name)
              else:
                  head = txt.split('//DummyShaderTextExporter')[0]
                  body = SPRITE_SUBSHADER if name.endswith('/Sprite') else SDF_SUBSHADER
                  open(f, 'w', encoding='utf-8').write(head + body)
                  n_fallback += 1
                  print('USING FALLBACK shader for:', name)
          print('TextMeshPro summary: real =', n_real, ' fallback =', n_fallback)
          PYEOF

      - name: Write real outline shaders
        run: |
          cat > project/Assets/Resources/shaders/outlinemask.shader <<'SHEOF'
          Shader "Custom/Outline Mask" {
            Properties {
              [Enum(UnityEngine.Rendering.CompareFunction)] _ZTest("ZTest", Float) = 0
            }
            SubShader {
              Tags { "Queue" = "Transparent+100" "RenderType" = "Transparent" }
              Pass {
                Name "Mask"
                Cull Off
                ZTest [_ZTest]
                ZWrite Off
                ColorMask 0
                Stencil {
                  Ref 1
                  Pass Replace
                }
                CGPROGRAM
                #include "UnityCG.cginc"
                #pragma vertex vert
                #pragma fragment frag
                struct appdata {
                  float4 vertex : POSITION;
                  UNITY_VERTEX_INPUT_INSTANCE_ID
                };
                struct v2f {
                  float4 position : SV_POSITION;
                  UNITY_VERTEX_OUTPUT_STEREO
                };
                v2f vert(appdata input) {
                  v2f output;
                  UNITY_SETUP_INSTANCE_ID(input);
                  UNITY_INITIALIZE_VERTEX_OUTPUT_STEREO(output);
                  output.position = UnityObjectToClipPos(input.vertex);
                  return output;
                }
                fixed4 frag(v2f input) : SV_Target {
                  return fixed4(0, 0, 0, 0);
                }
                ENDCG
              }
            }
          }
          SHEOF
          cat > project/Assets/Resources/shaders/outlinefill.shader <<'SHEOF'
          Shader "Custom/Outline Fill" {
            Properties {
              [Enum(UnityEngine.Rendering.CompareFunction)] _ZTest("ZTest", Float) = 0
              _OutlineColor("Outline Color", Color) = (1, 1, 1, 1)
              _OutlineWidth("Outline Width", Range(0, 10)) = 2
            }
            SubShader {
              Tags { "Queue" = "Transparent+110" "RenderType" = "Transparent" "DisableBatching" = "True" }
              Pass {
                Name "Fill"
                Cull Off
                ZTest [_ZTest]
                ZWrite Off
                Blend SrcAlpha OneMinusSrcAlpha
                ColorMask RGB
                Stencil {
                  Ref 1
                  Comp NotEqual
                }
                CGPROGRAM
                #include "UnityCG.cginc"
                #pragma vertex vert
                #pragma fragment frag
                struct appdata {
                  float4 vertex : POSITION;
                  float3 normal : NORMAL;
                  float3 smoothNormal : TEXCOORD3;
                  UNITY_VERTEX_INPUT_INSTANCE_ID
                };
                struct v2f {
                  float4 position : SV_POSITION;
                  fixed4 color : COLOR;
                  UNITY_VERTEX_OUTPUT_STEREO
                };
                uniform fixed4 _OutlineColor;
                uniform float _OutlineWidth;
                v2f vert(appdata input) {
                  v2f output;
                  UNITY_SETUP_INSTANCE_ID(input);
                  UNITY_INITIALIZE_VERTEX_OUTPUT_STEREO(output);
                  float3 normal = any(input.smoothNormal) ? input.smoothNormal : input.normal;
                  float3 viewPosition = UnityObjectToViewPos(input.vertex);
                  float3 viewNormal = normalize(mul((float3x3)UNITY_MATRIX_IT_MV, normal));
                  output.position = UnityViewToClipPos(viewPosition + viewNormal * -viewPosition.z * _OutlineWidth / 1000.0);
                  output.color = _OutlineColor;
                  return output;
                }
                fixed4 frag(v2f input) : SV_Target {
                  return input.color;
                }
                ENDCG
              }
            }
          }
          SHEOF
          head -3 project/Assets/Resources/shaders/outlinemask.shader

      - name: Disable broken post-processing layers
        run: |
          python3 - <<'PYEOF'
          import glob, re
          total = 0
          paths = glob.glob('project/Assets/Scenes/*.unity') + glob.glob('project/Assets/**/*.prefab', recursive=True)
          for p in paths:
              s = open(p, encoding='utf-8', errors='ignore').read()
              if 'stopNaNPropagation' not in s:
                  continue
              parts = re.split(r'(?m)^(?=--- !u!)', s)
              n = 0
              for i, d in enumerate(parts):
                  if d.startswith('--- !u!114') and 'volumeLayer:' in d and 'stopNaNPropagation:' in d:
                      parts[i] = d.replace('  m_Enabled: 1', '  m_Enabled: 0', 1)
                      n += 1
              if n:
                  open(p, 'w', encoding='utf-8').write(''.join(parts))
                  total += n
                  print(p, n)
          print('Disabled', total, 'PostProcessLayer components')
          PYEOF

      - name: Preserve animation and IK assemblies
        run: |
          cat > project/Assets/link.xml <<'XMLEOF'
          <linker>
            <assembly fullname="Unity.2D.Animation.Runtime" preserve="all"/>
            <assembly fullname="Unity.2D.IK.Runtime" preserve="all"/>
            <assembly fullname="Unity.2D.Common.Runtime" preserve="all"/>
            <assembly fullname="Unity.InternalAPIEngineBridge.001" preserve="all"/>
            <assembly fullname="Unity.Mathematics" preserve="all"/>
            <assembly fullname="Unity.TextMeshPro" preserve="all"/>
            <assembly fullname="Cinemachine" preserve="all"/>
          </linker>
          XMLEOF
          cat project/Assets/link.xml

      - name: Fix /home/packer permission bug
        run: sudo rm -rf /home/packer

      - name: Setup Unity Editor
        uses: buildalon/unity-setup@v3
        with:
          version-file: 'None'
          unity-version: '2020.3.40f1 (ba48d4efcef1)'
          build-targets: 'WebGL'
          allow-security-alert: true
          cache-installation: true

      - name: Activate Unity Personal License
        uses: buildalon/activate-unity-license@v3
        with:
          license: 'personal'
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Add Buildalon Build Pipeline Package
        working-directory: project
        run: |
          npm install -g openupm-cli
          openupm add com.virtualmaker.buildalon

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: project/Library
          key: Library-WebGL-ubuntu-22.04-2020.3.40f1-${{ hashFiles('project/Assets/**', 'project/Packages/**', 'project/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-ubuntu-22.04-2020.3.40f1-

      - name: Build WebGL Project
        run: |
          mkdir -p project/Builds/Logs
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            /home/runner/Unity/Hub/Editor/2020.3.40f1/Editor/Unity \
            -projectPath project \
            -logFile "$GITHUB_WORKSPACE/unity-build.log" \
            -automated \
            -buildTarget WebGL \
            -quit -batchmode \
            -job-worker-count 1 \
            -executeMethod Buildalon.Editor.BuildPipeline.UnityPlayerBuildTools.StartCommandLineBuild

      - name: Show end of Unity log if failed
        if: failure()
        run: tail -n 120 unity-build.log | cut -c1-300

      - name: Upload Unity diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-build-diagnostic-logs
          path: unity-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare build folder
        run: |
          set -e
          echo "Searching for WebGL index.html..."
          mapfile -t INDEX_FILES < <(
            find project/Builds -name index.html -type f
          )
          if [ "${#INDEX_FILES[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one index.html, found ${#INDEX_FILES[@]}"
            printf '%s\n' "${INDEX_FILES[@]}"
            exit 1
          fi
          BUILD_DIR="$(dirname "${INDEX_FILES[0]}")"
          echo "Using build directory: $BUILD_DIR"
          mkdir -p pages-artifact
          cp -a "$BUILD_DIR/." pages-artifact/
          test -f pages-artifact/index.html
          echo "Build contents:"
          ls -lah pages-artifact
          echo "Total size of site:"
          du -sh pages-artifact
          find pages-artifact -type f -size +90M -exec ls -lh {} \;

      - name: Upload downloadable WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-panic-webgl
          path: pages-artifact
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
